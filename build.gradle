import net.ltgt.gradle.errorprone.CheckSeverity

buildscript {
    repositories {
        mavenCentral() { metadataSources { mavenPom(); ignoreGradleMetadataRedirection() } }
        gradlePluginPortal() { metadataSources { mavenPom(); ignoreGradleMetadataRedirection() } }
    }
    dependencies {
        classpath 'com.palantir.jakartapackagealignment:jakarta-package-alignment:0.5.0'
        classpath 'com.palantir.gradle.externalpublish:gradle-external-publish-plugin:1.4.0'
        classpath 'com.palantir.baseline:gradle-baseline-java:7.0.0'
        classpath 'com.palantir.gradle.consistentversions:gradle-consistent-versions:3.8.0'
        classpath 'com.palantir.gradle.gitversion:gradle-git-version:4.3.0'
        classpath 'org.unbroken-dome.gradle-plugins:gradle-testsets-plugin:4.1.0'
        classpath 'com.palantir.gradle.conjure:gradle-conjure:5.64.0'
        classpath 'com.palantir.javaformat:gradle-palantir-java-format:2.86.0'
    }
}

plugins {
    id 'com.palantir.git-version' version '3.0.0'
}

apply plugin: 'com.palantir.external-publish'
apply plugin: 'com.palantir.baseline'
apply plugin: 'com.palantir.git-version'
apply plugin: 'com.palantir.consistent-versions'

version gitVersion()

allprojects {
    apply plugin: 'com.palantir.java-format'
    apply plugin: 'com.palantir.jakarta-package-alignment'
    version rootProject.version
    group 'com.palantir.docker.compose'

    repositories {
        mavenCentral() { metadataSources { mavenPom(); ignoreGradleMetadataRedirection() } }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'com.palantir.java-format'
    apply plugin: 'com.palantir.external-publish-jar'

    sourceCompatibility = 17
    targetCompatibility = 17

    dependencies {
        annotationProcessor 'org.immutables:value'
        compileOnly 'org.immutables:value::annotations'
    }

    tasks.withType(JavaCompile).configureEach {
        options.errorprone {

            check("CatchBlockLogException", CheckSeverity.OFF)
            check("PreconditionsConstantMessage", CheckSeverity.OFF)
            check("PreferSafeLoggableExceptions", CheckSeverity.OFF)
            check("PreferSafeLoggingPreconditions", CheckSeverity.OFF)
            check("Slf4jConstantLogMessage", CheckSeverity.OFF)
            check("ValidateConstantMessage", CheckSeverity.OFF)
            check("PreconditionsConstantMessage", CheckSeverity.OFF)
            check('Slf4jLogsafeArgs', CheckSeverity.OFF)

        }
    }
}
